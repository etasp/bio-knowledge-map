<div class="shell"><aside class="sidebar"><div class="brand"><span class="brandmark">◉</span>知识之间</div><div class="eyebrow">LEARNING ATLAS</div><div id="chapters" aria-label="选择章节"></div><footer><div class="muted">我的学习进度</div><div class="progress"><i id="progressbar"></i></div><div class="muted" id="progressText"></div><p class="muted">进度保存在当前浏览器。<br>用自己的节奏，建立知识之间的联系。</p><button class="export" id="exportProgress">导出学习记录</button><button class="export" id="importProgress">导入</button><input type="file" id="progressFile" accept=".json" hidden></footer></aside>
<main><header class="topbar"><span class="eyebrow">__HTML_TITLE__</span><label><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜索知识点、关键词或原文…" aria-label="搜索知识库"></label></header>
<section class="hero"><div><div class="eyebrow">LEARN / CONNECT / RECALL</div><h1>从一个知识点，<br>读懂知识的联系。</h1><p>沿着教材章节学习，在知识图谱中串联概念。<br>读懂之后，合上答案，再问自己一次。</p></div><div class="hero-art" aria-hidden="true"><div class="cell"><small>THE CELL / 连接与理解</small></div></div></section>

<script>
'use strict';
const DATA=JSON.parse(document.getElementById('study-data').textContent),CH=__CHAPTER_NAMES__,COLORS=['','#3e775f','#b58a3c','#6486a2','#aa725a','#7e7d4a','#8d7d9e'];
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state={mastered:[],saved:[],review:[]},chapter=0,view='graph',term='',limit=18,lesson='',quizIndex=0,revealed=false,quizOrder=[],graphFocus='',graphScale=1;
try{const old=JSON.parse(localStorage.getItem('__LIBRARY_ID__-study-v1')||'null');if(old)for(const k of Object.keys(state))if(Array.isArray(old[k]))state[k]=old[k].filter(x=>DATA.nodes.some(n=>n.id===x));}catch{}
const byId=new Map(DATA.nodes.map(n=>[n.id,n])),sources=new Map(DATA.sources.map(s=>[s.id,s]));
let graphPreferences={theme:'dark',labels:true};try{const saved=JSON.parse(localStorage.getItem('__LIBRARY_ID__-graph-preferences-v1')||'null');if(saved&&['light','dark','system'].includes(saved.theme)&&typeof saved.labels==='boolean')graphPreferences=saved}catch{}
function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').hidden=true,2400)}
function save(){try{localStorage.setItem('__LIBRARY_ID__-study-v1',JSON.stringify(state))}catch{toast('浏览器未允许保存；可导出学习记录。')}progress();publishGraphState()}
function progress(){const count=state.mastered.length;$('#progressText').textContent=`已掌握 ${count} / ${DATA.nodes.length} 个知识点`;$('#progressbar').style.width=(count/DATA.nodes.length*100)+'%';$('#stats').innerHTML=`<div><strong>${CH.length-1}</strong>教材章节</div><div><strong>${DATA.nodes.length}</strong>知识卡片</div><div><strong>${DATA.edges.length}</strong>知识关联</div><div><strong>${DATA.sources.length}</strong>原文资料</div>`}
function toggle(k,id){state[k]=state[k].includes(id)?state[k].filter(x=>x!==id):[...state[k],id];if(k==='mastered'&&state.mastered.includes(id))state.review=state.review.filter(x=>x!==id);if(k==='review'&&state.review.includes(id))state.mastered=state.mastered.filter(x=>x!==id);save()}
function sourceOf(n){return sources.get(n.source_id)}
function nav(){ $('#chapters').innerHTML=CH.map((c,i)=>`<button class="chapter ${chapter===i?'active':''}" data-chapter="${i}" aria-pressed="${chapter===i}"><span>${i?String(i).padStart(2,'0'):'◎'}</span><span>${esc(c)}</span></button>`).join('');document.querySelectorAll('.tabs button').forEach(b=>{b.classList.toggle('active',b.dataset.view===view);b.setAttribute('aria-pressed',b.dataset.view===view)})}
function filtered(){return DATA.nodes.filter(n=>(!chapter||n.chapter===chapter)&&(!lesson||n.lesson===lesson)&&(!term||[n.label,n.summary,n.pitfall,...n.points,n.question,n.answer].join(' ').toLowerCase().includes(term.toLowerCase())))}
function card(n){return `<article class="card"><div class="card-top"><span class="tag">${esc(n.lesson)} · 第${n.chapter}章</span><button class="star ${state.saved.includes(n.id)?'saved':''}" data-action="saved" data-id="${esc(n.id)}" aria-label="${state.saved.includes(n.id)?'取消收藏':'收藏'}${esc(n.label)}" aria-pressed="${state.saved.includes(n.id)}">${state.saved.includes(n.id)?'★':'☆'}</button></div><h3>${esc(n.label)}</h3><p class="summary">${esc(n.summary)}</p><div class="card-bottom"><button class="textbtn" data-action="open" data-id="${esc(n.id)}">展开学习 ↗</button><span class="${state.mastered.includes(n.id)?'learned':'muted'}">${state.mastered.includes(n.id)?'✓ 已掌握':state.review.includes(n.id)?'待复习':'待读'}</span></div></article>`}
function render(){document.body.classList.toggle('graph-mode',view==='graph');nav();progress();if(view==='sources')return renderSources();if(view==='quiz')return renderQuiz();if(view==='graph')return renderGraph();let list=filtered();if(view==='review')list=list.filter(n=>state.review.includes(n.id)||state.saved.includes(n.id));const lessons=[...new Set(DATA.nodes.filter(n=>!chapter||n.chapter===chapter).map(n=>n.lesson))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));$('#content').innerHTML=`<div class="toolbar"><h2>${view==='review'?'留给下一次的重点':chapter?`第${chapter}章 · ${CH[chapter]}`:'全书知识卡片'}</h2><select id="lesson" aria-label="按教材小节筛选"><option value="">全部小节</option>${lessons.map(l=>`<option ${lesson===l?'selected':''} value="${esc(l)}">${esc(l)} ${esc(DATA.lessons[l]||'')}</option>`).join('')}</select></div><div class="result">${list.length} 个知识点${view==='review'?' · 收藏或自测时选择“再学一次”的卡片':''}${term?' · 搜索：'+esc(term):''}</div><div class="grid">${list.length?list.slice(0,limit).map(card).join(''):`<div class="empty">${view==='review'?'还没有复习卡片。收藏知识点，或在自测中标记“再学一次”。':'没有找到匹配内容，请调整关键词或章节。'}</div>`}</div>${list.length>limit?'<button id="more" class="loadmore">继续展开知识点</button>':''}`;$('#lesson').onchange=e=>{lesson=e.target.value;limit=18;render()};if($('#more'))$('#more').onclick=()=>{limit+=18;render()}}
function openCard(id){const n=byId.get(id);if(!n)return;const src=sourceOf(n),rels=DATA.edges.filter(e=>e.source===id||e.target===id).map(e=>({n:byId.get(e.source===id?e.target:e.source),e})).filter(x=>x.n);$('#detailContent').innerHTML=`<button class="close" aria-label="关闭知识卡">×</button><div class="eyebrow">第 ${n.chapter} 章 / ${esc(n.lesson)} ${esc(DATA.lessons[n.lesson]||'')}</div><h2>${esc(n.label)}</h2><p>${esc(n.summary)}</p><ul>${n.points.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${n.pitfall?`<div class="pitfall"><strong>易错提醒</strong><br>${esc(n.pitfall)}</div>`:""}${n.question?`<details class="inline-answer"><summary>${esc(n.question)}</summary><p>${esc(n.answer)}</p></details>`:""}<div class="actions"><button class="primary" data-action="mastered" data-id="${esc(id)}">${state.mastered.includes(id)?'✓ 已掌握 · 取消标记':'标记为已掌握'}</button><button data-action="review" data-id="${esc(id)}">${state.review.includes(id)?'移出待复习':'加入待复习'}</button></div>${rels.length?`<div class="sourceblock"><strong>关联知识</strong><div class="actions">${rels.slice(0,10).map(x=>`<button class="textbtn" title="${esc(x.e.relation)} · ${x.e.confidence==='INFERRED'?'学习关联':'原文关系'}" data-action="open" data-id="${esc(x.n.id)}">${esc(x.n.label)}</button>`).join('')}</div></div>`:''}<div class="sourceblock muted">来源：${esc(src?.name||'原始资料')} · ${esc(n.source_location||'正文')}<blockquote>${esc(n.evidence||'')}</blockquote><button class="textbtn" data-action="source" data-id="${esc(n.source_id)}" data-location="${esc(n.source_location||'')}">查看来源原文</button></div>`;$('#detailContent .close').onclick=()=>$('#detail').close();if(!$('#detail').open)$('#detail').showModal()}
function renderSources(){const list=DATA.sources.filter(s=>(!chapter||s.chapters.includes(chapter))&&(!term||(s.name+' '+s.text).toLowerCase().includes(term.toLowerCase())));$('#content').innerHTML=`<div class="toolbar"><h2>原文资料</h2><span class="muted">${list.length} 份资料</span></div><p class="note">原文由课件文字及矢量对象提取，供检索和溯源。图示、版式与嵌入公式可能无法在文字版中完整呈现；含图题请打开完整包内的原文件。原题答案保留原貌，遇到疑义请对照教材。</p><div class="source-list">${list.map(s=>`<div class="source-row"><div><strong>${esc(s.name)}${s.variant?'（另一版本）':''}</strong><div class="muted">${s.kind==='ppt'?'课件':'练习'} · ${s.chapters.map(c=>'第'+c+'章').join('、')||'全书目录'}</div></div><div class="actions"><button class="textbtn" data-action="source" data-id="${esc(s.id)}">阅读文字版</button><a class="textbtn" href="${esc(s.original_link)}" download>原文件</a></div></div>`).join('')||'<div class="empty">没有找到匹配的原文资料。</div>'}</div>`}
__SOURCE_READER__
function prepareQuiz(){quizOrder=filtered().filter(n=>n.question&&n.answer).map(n=>n.id);for(let i=quizOrder.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[quizOrder[i],quizOrder[j]]=[quizOrder[j],quizOrder[i]]}quizIndex=0;revealed=false}
function renderQuiz(){if(!quizOrder.length)prepareQuiz();const n=byId.get(quizOrder[quizIndex]);$('#content').innerHTML=`<div class="toolbar"><h2>先回忆，再翻答案</h2><button id="shuffle">重新洗牌</button></div><p class="muted">按当前章节和搜索范围练习。请先在心里或纸上回答，再自行判断是否掌握。</p>${n?`<article class="quiz"><div class="eyebrow">${quizIndex+1} / ${quizOrder.length} · ${esc(n.lesson)} · ${esc(n.label)}</div><h2>${esc(n.question)}</h2>${revealed?`<div class="answer">${esc(n.answer)}</div><p class="muted">易错：${esc(n.pitfall)}</p><button class="textbtn" data-action="open" data-id="${esc(n.id)}">回到知识卡片</button><div class="quiznav"><button class="primary" id="remember">记住了，下一题</button><button id="again">再学一次</button></div>`:'<button class="primary" id="reveal">查看参考答案</button>'}</article>`:'<div class="empty">当前筛选下没有自测题，请更换章节或关键词。</div>'}`;$('#shuffle').onclick=()=>{prepareQuiz();renderQuiz()};if($('#reveal'))$('#reveal').onclick=()=>{revealed=true;renderQuiz()};if($('#remember'))$('#remember').onclick=()=>{if(!state.mastered.includes(n.id))state.mastered.push(n.id);state.review=state.review.filter(x=>x!==n.id);nextQuiz()};if($('#again'))$('#again').onclick=()=>{if(!state.review.includes(n.id))state.review.push(n.id);state.mastered=state.mastered.filter(x=>x!==n.id);nextQuiz()}}
function nextQuiz(){save();revealed=false;quizIndex++;if(quizIndex>=quizOrder.length){$('#content').innerHTML=`<div class="quiz"><div class="eyebrow">RECALL COMPLETE</div><h2>这一轮回忆完成。</h2><p class="muted">共练习 ${quizOrder.length} 题。标记为“再学一次”的知识点已加入“我的复习”。</p><div class="actions"><button class="primary" id="toReview">查看待复习</button><button id="restartQuiz">再来一轮</button></div></div>`;$('#toReview').onclick=()=>{view='review';render()};$('#restartQuiz').onclick=()=>{prepareQuiz();renderQuiz()};return}renderQuiz()}
function publishGraphState(){const frame=$('#nativeGraphFrame');if(frame?.dataset.ready==='true')frame.contentWindow.postMessage({type:'study:state',state},'*')}
function syncGraphFilter(reset=false){
 const frame=$('#nativeGraphFrame');if(!frame||frame.dataset.ready!=='true')return;
 const ids=!chapter&&!term?DATA.graph_nodes.map(n=>n.id):filtered().map(n=>n.id);
 frame.contentWindow.postMessage({type:'study:filter',ids,reset,chapter},'*');
 $('#graphCount').textContent=`显示 ${ids.length} / ${DATA.graph_nodes.length} 个节点${chapter?' · 第'+chapter+'章':''}${term?' · 搜索：'+term:''}`;
}
function renderGraph(){
 if(!$('#nativeGraphFrame')){
  $('#content').innerHTML=`<div class="graph-home-actions"><div class="graph-home-title">${esc(DATA.title)} · 知识地图<small>看讲解 · 查原文 · 记复习</small></div><div class="graph-home-buttons"><button id="graphStart">开始学习</button><button id="graphAll">全书图谱</button><button id="showCards">知识卡片</button></div></div><span id="graphCount" class="graph-status">正在加载原生图谱…</span><iframe id="nativeGraphFrame" title="Graphify 原生交互知识图谱" sandbox="allow-scripts"></iframe>`;
  $('#graphStart').onclick=()=>$('#nativeGraphFrame').contentWindow.postMessage({type:'study:start'},'*');
  $('#showCards').onclick=()=>{view='learn';render()};
  $('#nativeGraphFrame').srcdoc=DATA.native_graph;
  $('#graphAll').onclick=()=>{chapter=0;term='';lesson='';$('#search').value='';nav();syncGraphFilter(true)};
 }else syncGraphFilter();
}
function openGraphNode(id){
 if(byId.has(id)){openCard(id);return}
 const n=DATA.graph_nodes.find(n=>n.id===id);if(!n)return;
 const src=sources.get(n.source_id);
 $('#detailContent').innerHTML=`<button class="close" aria-label="关闭讲解">×</button><div class="eyebrow">全书导航</div><h2>${esc(n.label)}</h2><p>${esc(n.summary)}</p><div class="sourceblock muted">来源：${esc(src?.name||'原始资料')} · ${esc(n.source_location)}<blockquote>${esc(n.evidence)}</blockquote><button class="textbtn" data-action="source" data-id="${esc(n.source_id)}" data-location="${esc(n.source_location)}">查看来源原文</button></div>`;
 $('#detailContent .close').onclick=()=>$('#detail').close();if(!$('#detail').open)$('#detail').showModal();
}
window.addEventListener('message',event=>{
 const frame=$('#nativeGraphFrame');if(!frame||event.source!==frame.contentWindow||!event.data)return;
 if(event.data.type==='graphify:ready'){frame.contentWindow.postMessage({type:'study:catalog',nodes:[...DATA.graph_nodes.filter(n=>!byId.has(n.id)),...DATA.nodes]},'*');frame.dataset.ready='true';frame.contentWindow.postMessage({type:'study:preferences',preferences:graphPreferences},'*');publishGraphState();syncGraphFilter()}
 else if(event.data.type==='graphify:chapter'&&Number.isInteger(event.data.chapter)&&event.data.chapter>=0&&event.data.chapter<CH.length){chapter=event.data.chapter;term='';lesson='';$('#search').value='';nav();syncGraphFilter(true)}
 else if(event.data.type==='graphify:preferences'){const preferences=event.data.preferences;if(preferences&&['light','dark','system'].includes(preferences.theme)&&typeof preferences.labels==='boolean'){graphPreferences={theme:preferences.theme,labels:preferences.labels};try{localStorage.setItem('__LIBRARY_ID__-graph-preferences-v1',JSON.stringify(graphPreferences))}catch{}}}
 else if(typeof event.data.id==='string'){
  const n=byId.get(event.data.id)||DATA.graph_nodes.find(n=>n.id===event.data.id);if(!n)return;
  if(event.data.type==='graphify:node')frame.contentWindow.postMessage({type:'study:detail',node:{...n,source_name:sources.get(n.source_id)?.name||''}},'*');
  else if(event.data.type==='graphify:source')showSource(n.source_id,n.source_location);
  else if(event.data.type==='graphify:card')openGraphNode(n.id);
  else if(event.data.type==='graphify:state'&&byId.has(n.id)&&['mastered','saved','review'].includes(event.data.action))toggle(event.data.action,n.id);
 }
});
document.addEventListener('click',e=>{let b=e.target.closest('[data-chapter]');if(b){chapter=+b.dataset.chapter;limit=18;lesson='';graphFocus='';quizOrder=[];render();return}b=e.target.closest('[data-view]');if(b){view=b.dataset.view;limit=18;lesson='';quizOrder=[];graphFocus='';render();return}b=e.target.closest('[data-action]');if(!b)return;let {action,id,location}=b.dataset;if(action==='open')openCard(id);else if(action==='source')showSource(id,location);else if(['saved','mastered','review'].includes(action)){toggle(action,id);if($('#detail').open)openCard(id);else render()}});
$('#search').addEventListener('input',e=>{term=e.target.value.trim();limit=18;quizOrder=[];quizIndex=0;graphFocus='';render()});$('#detail').addEventListener('click',e=>{if(e.target===$('#detail'))$('#detail').close()});
$('#exportProgress').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,...state},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='学习记录.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('#importProgress').onclick=()=>$('#progressFile').click();$('#progressFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>1000000)throw Error();const d=JSON.parse(await file.text());if(!['mastered','saved','review'].every(k=>Array.isArray(d[k])))throw Error();for(const k of Object.keys(state))state[k]=[...new Set([...state[k],...d[k].filter(x=>byId.has(x))])];save();render();toast('学习记录已合并')}catch{toast('无法读取记录，请选择导出的学习记录 JSON。')}e.target.value=''};
nav();progress();render();
</script></body></html>
